<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faça uma Pergunta - KB Copilot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">KB Copilot</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link active" href="/ask">Perguntar</a>
                <a class="nav-link" href="/admin">Admin</a>
                <a class="nav-link" href="/logout">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h3>Faça uma Pergunta</h3>
                    </div>
                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger" role="alert">
                            <span th:text="${error}"></span>
                        </div>
                        
                        <form th:action="@{/ask}" method="post">
                            <div class="mb-3">
                                <label for="question" class="form-label">Sua Pergunta:</label>
                                <textarea class="form-control" id="question" name="question" rows="4" 
                                          placeholder="Digite sua pergunta aqui..." th:value="${question}" required></textarea>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Enviar Pergunta</button>
                            </div>
                        </form>
                        
                        <div class="mt-4">
                            <h5>Exemplos de perguntas:</h5>
                            <ul class="list-unstyled">
                                <li><a href="/ask?question=Qual é a missão da empresa?" class="text-decoration-none">Qual é a missão da empresa?</a></li>
                                <li><a href="/ask?question=Como funciona o processo de vendas?" class="text-decoration-none">Como funciona o processo de vendas?</a></li>
                                <li><a href="/ask?question=Quais são os principais produtos?" class="text-decoration-none">Quais são os principais produtos?</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

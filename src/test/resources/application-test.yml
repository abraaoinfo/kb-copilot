spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/aiapp_test
    username: test
    password: test
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  
  ai:
    openai:
      api-key: test-api-key
      chat:
        options:
          model: gpt-3.5-turbo
          temperature: 0.7
          max-tokens: 1000
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 1536
    
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

# Rate limiting for tests
rate-limit:
  ask:
    capacity: 100
    refill-rate: 50
    refill-period: 60

# Logging for tests
logging:
  level:
    com.example.kb: DEBUG
    org.springframework.ai: DEBUG
    org.testcontainers: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{requestId}] %logger{36} - %msg%n"


